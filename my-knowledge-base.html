<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人知识库 · 辛燕华</title>
<style>
:root{--gold:#C9A84C;--gold2:#E0C878;--bg:#fff;--bg2:#faf8f2;--text:#222;--text2:#666;--line:#e5e5e5;--card:#fff;}
[data-theme="dark"]{--gold:#E0C878;--gold2:#C9A84C;--bg:#0a0a0a;--bg2:#1a1a1a;--text:#fff;--text2:#ccc;--line:#333;--card:#1a1a1a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
.nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:100;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;}
.nav-left{display:flex;align-items:center;gap:12px;}
.logo{width:38px;height:38px;border-radius:6px;background:var(--gold);color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;}
.nav h1{font-size:18px;font-weight:700;color:var(--gold);}
.theme-btn{width:38px;height:38px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;font-size:16px;color:#000;}
.container{max-width:900px;margin:0 auto;padding:24px;}
.profile{background:var(--bg2);border-radius:12px;padding:32px;margin-bottom:24px;text-align:center;}
.avatar{width:80px;height:80px;border-radius:50%;background:var(--gold);color:#000;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;margin:0 auto 16px;}
.profile h2{font-size:24px;font-weight:900;margin-bottom:4px;}
.profile .title{color:var(--gold);font-size:15px;margin-bottom:12px;}
.profile .bio{color:var(--text2);font-size:14px;line-height:1.8;max-width:600px;margin:0 auto;}
.section{margin-bottom:24px;}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.section h3{font-size:18px;font-weight:700;color:var(--gold);}
.add-btn{background:var(--gold);color:#000;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:12px;}
.card h4{font-size:16px;font-weight:700;margin-bottom:6px;}
.card .meta{font-size:13px;color:var(--text2);margin-bottom:8px;}
.card p{font-size:14px;color:var(--text);line-height:1.8;}
.tag{display:inline-block;background:var(--bg2);color:var(--gold);font-size:12px;padding:3px 10px;border-radius:4px;margin:2px;}
.tag-row{margin-top:8px;}
.toolbar{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;}
.tool-btn{background:var(--bg2);color:var(--text);border:1px solid var(--line);padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;}
.tool-btn:hover{border-color:var(--gold);color:var(--gold);}
.empty{text-align:center;padding:40px;color:var(--text2);font-size:14px;}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;margin-bottom:10px;font-family:inherit;}
input:focus,textarea:focus{outline:none;border-color:var(--gold);}
textarea{min-height:80px;resize:vertical;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:200;justify-content:center;align-items:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg);border-radius:12px;padding:28px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;}
.modal h3{color:var(--gold);margin-bottom:16px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
.btn-primary{background:var(--gold);color:#000;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:700;}
.btn-secondary{background:var(--bg2);color:var(--text);border:1px solid var(--line);padding:10px 20px;border-radius:6px;cursor:pointer;}
.delete-btn{color:#e74c3c;cursor:pointer;font-size:13px;}
@media(max-width:600px){.container{padding:16px;}.profile{padding:20px;}}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-left">
    <div class="logo">墩</div>
    <h1>个人知识库</h1>
  </div>
  <button class="theme-btn" onclick="toggleTheme()">◐</button>
</nav>

<div class="container">
  <div class="toolbar">
    <button class="tool-btn" onclick="exportData()">导出备份</button>
    <button class="tool-btn" onclick="document.getElementById('importFile').click()">导入恢复</button>
    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
  </div>

  <div class="profile">
    <div class="avatar">辛</div>
    <h2 id="displayName">辛燕华</h2>
    <div class="title">墩墩总指挥 · 屏墩墩集团创始人</div>
    <p class="bio" id="displayBio">30年企业管理经验，从国企到贸易到制造到数字经济。现在用AI智能体团队，帮实体门店老板建立个人IP和智能接客系统。</p>
  </div>

  <div class="section">
    <div class="section-header">
      <h3>核心技能</h3>
      <button class="add-btn" onclick="addItem('skills')">+ 添加</button>
    </div>
    <div id="skillsList"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <h3>项目经验</h3>
      <button class="add-btn" onclick="addItem('projects')">+ 添加</button>
    </div>
    <div id="projectsList"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <h3>工作经历</h3>
      <button class="add-btn" onclick="addItem('experience')">+ 添加</button>
    </div>
    <div id="experienceList"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <h3>笔记/思考</h3>
      <button class="add-btn" onclick="addItem('notes')">+ 添加</button>
    </div>
    <div id="notesList"></div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle">添加</h3>
    <input type="text" id="inputTitle" placeholder="标题">
    <input type="text" id="inputMeta" placeholder="时间/职位/标签（可选）">
    <textarea id="inputContent" placeholder="详细内容"></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="saveItem()">保存</button>
    </div>
  </div>
</div>

<script>
var currentSection = '';
var editIndex = -1;

function loadData(){
  try{
    var raw = localStorage.getItem('myKB');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {skills:[],projects:[],experience:[],notes:[]};
}

function saveData(data){
  localStorage.setItem('myKB', JSON.stringify(data));
}

var data = loadData();

function render(){
  renderList('skills');
  renderList('projects');
  renderList('experience');
  renderList('notes');
}

function renderList(type){
  var el = document.getElementById(type+'List');
  var items = data[type];
  if(!items.length){
    el.innerHTML = '<div class="empty">暂无内容，点击右上角添加</div>';
    return;
  }
  el.innerHTML = items.map(function(item,i){
    return '<div class="card"><h4>'+esc(item.title)+'</h4>'+
      (item.meta?'<div class="meta">'+esc(item.meta)+'</div>':'')+
      '<p>'+esc(item.content)+'</p>'+
      '<div class="tag-row"><span class="delete-btn" onclick="delItem(\''+type+'\','+i+')">删除</span></div></div>';
  }).join('');
}

function addItem(type){
  currentSection = type;
  editIndex = -1;
  document.getElementById('modalTitle').textContent = '添加' + typeName(type);
  document.getElementById('inputTitle').value = '';
  document.getElementById('inputMeta').value = '';
  document.getElementById('inputContent').value = '';
  document.getElementById('modal').classList.add('show');
}

function editItem(type,i){
  currentSection = type;
  editIndex = i;
  var item = data[type][i];
  document.getElementById('modalTitle').textContent = '编辑' + typeName(type);
  document.getElementById('inputTitle').value = item.title;
  document.getElementById('inputMeta').value = item.meta||'';
  document.getElementById('inputContent').value = item.content;
  document.getElementById('modal').classList.add('show');
}

function saveItem(){
  var title = document.getElementById('inputTitle').value.trim();
  if(!title) return;
  var item = {title:title, meta:document.getElementById('inputMeta').value.trim(), content:document.getElementById('inputContent').value.trim()};
  if(editIndex >= 0){
    data[currentSection][editIndex] = item;
  } else {
    data[currentSection].push(item);
  }
  saveData(data);
  closeModal();
  render();
}

function delItem(type,i){
  if(confirm('确定删除？')){
    data[type].splice(i,1);
    saveData(data);
    render();
  }
}

function closeModal(){
  document.getElementById('modal').classList.remove('show');
}

function typeName(t){
  return {skills:'技能',projects:'项目',experience:'经历',notes:'笔记'}[t]||t;
}

function esc(s){
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('kb-theme',next);}catch(e){}
}

function exportData(){
  var blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'my-knowledge-base.json';
  a.click();
}

function importData(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      data = JSON.parse(ev.target.result);
      saveData(data);
      render();
      alert('导入成功');
    }catch(err){alert('文件格式错误');}
  };
  reader.readAsText(file);
}

// 初始化主题
try{
  var t = localStorage.getItem('kb-theme');
  if(t) document.documentElement.setAttribute('data-theme',t);
}catch(e){}

// 初始示例数据
if(!data.skills.length){
  data.skills = [
    {title:'企业战略与管理',meta:'30年经验',content:'从国企到贸易到制造，擅长组织架构设计、团队管理、业务流程优化。'},
    {title:'AI智能体架构',meta:'2026年',content:'主导设计6大智能体矩阵，覆盖内容、客服、短视频、文案、采购、财务全链路。'},
    {title:'个人IP打造',meta:'实体门店方向',content:'帮门店老板从0到1建立个人IP，包括定位、内容、接客、变现闭环。'}
  ];
  data.projects = [
    {title:'屏墩墩13站官网矩阵',meta:'2026年',content:'pddun.com集团主站、pddun.cn智能体超市、aiddun.cn万店AI赋能、dundununion.com墩墩联盟等13个站点协同。'},
    {title:'万店AI赋能计划',meta:'陪跑10万家实体店',content:'3年陪跑，老板个人IP+门店品牌+智能接客，每县1席独家。'},
    {title:'OPC一人公司孵化',meta:'墩墩联盟',content:'帮普通人建立个人商业系统，5步闭环：定位→产品化→内容→私域→系统化。'}
  ];
  data.experience = [
    {title:'屏墩墩集团 创始人',meta:'2024至今',content:'从0搭建AI智能体团队，13个官网矩阵，服务实体门店老板。'},
    {title:'制造业企业管理',meta:'2000-2024',content:'20多年制造企业管理经验，熟悉生产、供应链、团队管理。'}
  ];
  data.notes = [
    {title:'AI时代的老板定位',meta:'2026-10',content:'老板不用会写代码、不用会拍视频。老板只做两件事：判断方向、拍板资源。其他全交给AI。'},
    {title:'GEO是下一个流量入口',meta:'2026-10',content:'以前客户百度搜你，现在客户DeepSeek问你。先做GEO的店，吃第一波红利。'}
  ];
  saveData(data);
}

render();
</script>
</body>
</html>
